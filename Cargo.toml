[workspace]
resolver = "3"
package.version = "0.1.0"
package.edition = "2024"
# Shared crates.io metadata, inherited by every crate via `*.workspace = true`.
package.license = "Apache-2.0"
package.repository = "https://github.com/blackpantech/metro-feed"
package.homepage = "https://github.com/blackpantech/metro-feed"
package.readme = "README.md"
package.keywords = ["rss", "atom", "feed", "reader", "cli"]
package.categories = ["command-line-utilities"]
members = [
    "crates/metro",
    "crates/metro-cli",
    "crates/metro-tui",
    "crates/metro-core",
]

[workspace.dependencies]
# Sibling crates. `path` is used for local builds, `version` for the published
# crates. The `=` pin is deliberate: the four crates always ship together, so
# it must equal `package.version` above. Bump all three alongside it (Cargo
# refuses to build if they disagree, so a missed bump cannot slip through).
metro-core = { path = "crates/metro-core", version = "=0.1.0" }
metro-cli = { path = "crates/metro-cli", version = "=0.1.0" }
metro-tui = { path = "crates/metro-tui", version = "=0.1.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
rusqlite = { version = "0.32", features = ["bundled", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
jiff = "0.2"
directories = "6.0"
ureq = "3.5"
rustls = "0.24"
feed-rs = "3.0"
scraper = "0.29"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
